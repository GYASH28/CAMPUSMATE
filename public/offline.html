<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07101f" />
    <title>CampusMate Offline</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #172554, #060913 58%);
        color: #f8fafc;
        font-family: Inter, system-ui, sans-serif;
        padding: 24px;
      }
      main {
        max-width: 560px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 28px;
        padding: 28px;
        background: rgba(15, 23, 42, 0.78);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        text-align: center;
      }
      h1 { margin: 0; font-size: 32px; }
      p { color: #cbd5e1; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline.</h1>
      <p>Some CampusMate features need internet connection.</p>
    </main>
  </body>
</html>
